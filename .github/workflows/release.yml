name: Build and release JAR

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate and build
        run: mvn -s .mvn/settings.xml --batch-mode --no-transfer-progress -Dgpg.skip=true clean verify
      - name: Checksum
        working-directory: target
        run: sha256sum keycloak-russian-providers.jar > keycloak-russian-providers.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: provider-jar
          path: |
            target/keycloak-russian-providers.jar
            target/keycloak-russian-providers.jar.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-jar
      - name: Publish tagged JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check keycloak-russian-providers.jar.sha256
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes 'Built for Keycloak 26.7.1. Imports and refreshes Yandex avatars; removes OAuth configuration logging.' \
            keycloak-russian-providers.jar keycloak-russian-providers.jar.sha256
