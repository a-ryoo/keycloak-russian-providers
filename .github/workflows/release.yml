name: Build and release JAR

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the runtime-matching JDK
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/jdk.tar.gz" \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz'
          echo "ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94  $RUNNER_TEMP/jdk.tar.gz" | sha256sum --check
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: jdkfile
          java-version: '21'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          cache: maven
      - name: Validate and build
        run: |
          java -version 2>&1 | head -1 | grep -F '"21.0.12.1"'
          mvn -s .mvn/settings.xml --batch-mode --no-transfer-progress clean verify
      - name: Reject known JAR vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          scan-type: sbom
          scan-ref: target/bom.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: target/vulnerability-report.json
      - name: Checksum
        working-directory: target
        run: sha256sum keycloak-russian-providers.jar > keycloak-russian-providers.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: provider-jar
          path: |
            target/keycloak-russian-providers.jar
            target/keycloak-russian-providers.jar.sha256
            target/vulnerability-report.json
            target/bom.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-jar
      - name: Publish tagged JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check keycloak-russian-providers.jar.sha256
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes 'Keycloak 26.8.x only; Java 21.0.12.1. Adds trusted Yandex account linking by exact email, uses email as username, and synchronizes the Yandex profile in FORCE mode. Bundled dependencies pass the Trivy vulnerability gate. Includes the exact runtime-library SBOM.' \
            keycloak-russian-providers.jar keycloak-russian-providers.jar.sha256 vulnerability-report.json bom.json
