name: Build and release JAR

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12.1'
          cache: maven
      - name: Validate and build
        run: mvn -s .mvn/settings.xml --batch-mode --no-transfer-progress clean verify
      - name: Reject known JAR vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          scan-type: sbom
          scan-ref: target/bom.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: target/vulnerability-report.json
      - name: Checksum
        working-directory: target
        run: sha256sum keycloak-russian-providers.jar > keycloak-russian-providers.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: provider-jar
          path: |
            target/keycloak-russian-providers.jar
            target/keycloak-russian-providers.jar.sha256
            target/vulnerability-report.json
            target/bom.json

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: provider-jar
      - name: Publish tagged JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check keycloak-russian-providers.jar.sha256
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes 'Keycloak 26.8.x only; Java 21.0.12.1. Imports and refreshes Yandex avatars. Bundled dependencies pass the Trivy vulnerability gate. Includes the exact runtime-library SBOM.' \
            keycloak-russian-providers.jar keycloak-russian-providers.jar.sha256 vulnerability-report.json bom.json
